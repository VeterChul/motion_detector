  #      condition: service_healthy
  #  healthcheck:
  #    test: ["CMD-SHELL", "test -f /data/heartbeat && test $(( $(date +%s) - $(stat -c %Y /data/heartbeat) )) -lt 60"]
  #    interval: 30s
  #    timeout: 10s
