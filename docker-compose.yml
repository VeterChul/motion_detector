  #      max-size: "10m"
  #      max-file: "3"
  #  labels:
  #    - autoheal=true
  #  networks:
  #    - cctv

  # ─────────────────────────────────────────────────────────
  # autoheal — перезапуск unhealthy-контейнеров
  # ─────────────────────────────────────────────────────────
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - cctv

networks:
  cctv:
    name: cctv-network
    driver: bridge

volumes:
  mosquitto_data:
    name: cctv-mosquitto-data
