services:
  # ─────────────────────────────────────────────────────────
  # mediamtx — медиасервер
  # ─────────────────────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - /home/veter/my_bin/recordings:/recordings # папка архива видео
      - /dev:/dev
    device_cgroup_rules:
      - 'c 81:* rmw'    # video4linux (камера)
      - 'c 116:* rmw'   # ALSA (микрофон)
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD", "ffprobe", "-v", "error", "-rtsp_transport", "tcp",
             "-i", "rtsp://localhost:8554/cam",
             "-show_entries", "stream=codec_type", "-of", "csv=p=0"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    cpu_shares: 2048
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true
    networks:
      - cctv

  # ─────────────────────────────────────────────────────────
  # mosquitto — MQTT-брокер
  # ─────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u $$MQTT_USER -P $$MQTT_PASS -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - autoheal=true
    networks:
      - cctv

  # ─────────────────────────────────────────────────────────
  # detector — анализ видеопотока
  # ─────────────────────────────────────────────────────────
  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    image: cctv-detector:local
    container_name: detector
    restart: unless-stopped
    volumes:
      - ./detector/config.yaml:/app/config.yaml:ro
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    #healthcheck:
    #  test: ["CMD-SHELL", "test -f /tmp/heartbeat && test $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 60"]
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    #labels:
    #  - autoheal=true
    networks:
      - cctv

  # ─────────────────────────────────────────────────────────
  # sender — логика уведомлений и Telegram-бот
  # ─────────────────────────────────────────────────────────
  #sender:
