# Слушатель
listener 1883
protocol mqtt

# Анонимный доступ запрещён
allow_anonymous false
password_file /mosquitto/config/passwd

# Персистентность: очереди QoS 1 для offline-подписчиков
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Логи
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Системные топики ($SYS/...) — нужны для healthcheck
sys_interval 10